<!DOCTYPE html>
<!--
IntegrityFlow file overview
Purpose: Layout and styling of the exam-code entry page.
How it works: Defines the code field, join button, error area and branding that login.js updates.
Connection: Electron loads this screen at entry; shared styles come from styles/main.css.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntegrityFlow — Candidate Login</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f7f6;
      color: #333;
    }

    .container {
      background: white;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #23383f;
    }

    p.subtitle {
      margin: 0 0 24px 0;
      color: #526b76;
      font-size: 14px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d6e1e6;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #087d78;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #087d78;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      background-color: #056962;
    }

    button:disabled {
      background-color: #526b76;
      cursor: not-allowed;
    }

    .error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body class="candidate-login">
  <div class="container">
    <img src="assets/logo.svg" alt="IntegrityFlow"
      style="width: 54px; height: 54px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);">
    <h1>IntegrityFlow</h1>
    <p class="subtitle">Secure Exam Environment</p>

    <div class="form-group">
      <label for="examId">Exam Code</label>
      <input type="text" id="examId" placeholder="e.g. EXAM-101" autofocus required minlength="4" maxlength="32"
        pattern="(?=.*[A-Za-z0-9])[A-Za-z0-9\-]{4,32}" aria-describedby="errorMsg" />
      <div style="font-size: 11.5px; color: #526b76; margin-top: 4px; text-align: left;">Enter the unique code provided
        by your instructor.</div>
    </div>

    <button id="loginBtn">Enter Exam ➔</button>
    <div id="errorMsg" class="error" role="alert"></div>
  </div>

  <script src="dist/login.js"></script>
</body>

</html>
