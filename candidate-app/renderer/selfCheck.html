<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IntegrityFlow — System Self-Check</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1f2937; margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: white; padding: 2rem 2.5rem; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 16px rgba(0,0,0,0.06); width: 100%; max-width: 600px; }
    .brand-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.5rem; text-align: center; }
    .brand-header img { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25); }
    h1 { margin-top: 0; margin-bottom: 4px; font-size: 1.5rem; text-align: center; color: #0f172a; }
    .check-item { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #e5e7eb; }
    .check-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; font-weight: bold; }
    .status-icon { font-size: 1.25rem; }
    .status-pending { color: #9ca3af; }
    .status-pass { color: #10b981; }
    .status-fail { color: #ef4444; }
    .check-content { display: flex; flex-direction: column; gap: 0.5rem; }
    video { width: 100%; max-width: 320px; height: 240px; background: #000; border-radius: 4px; object-fit: cover; }
    .mic-meter-container { width: 100%; height: 20px; background: #e5e7eb; border-radius: 10px; overflow: hidden; }
    .mic-meter { height: 100%; background: #10b981; width: 0%; transition: width 0.1s; }
    .app-list { list-style-type: none; padding: 0; margin: 0; color: #ef4444; }
    .app-list li { margin-bottom: 0.25rem; }
    button { background: #1a73e8; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold; transition: background-color 0.2s; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #1557d0; }
    .secondary-button { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; margin-top: 0.5rem; }
    .secondary-button:hover:not(:disabled) { background: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="assets/icon.png" alt="IntegrityFlow">
      <h1>System Self-Check</h1>
      <p style="color: #64748b; font-size: 14px; margin: 0;">Verify your hardware and environment before starting the exam.</p>
      <div id="candidateInfoBadge" style="margin-top: 10px; font-size: 13px; font-weight: 500; color: #1a73e8; background: #e8f0fe; padding: 6px 14px; border-radius: 20px; display: inline-block; border: 1px solid #c2e7ff;">Candidate: Loading...</div>
    </div>

    <div class="check-item" id="check-camera">
      <div class="check-header">
        <span>1. Camera Check</span>
        <span class="status-icon status-pending">⏳</span>
      </div>
      <div class="check-content">
        <video id="camera-preview" autoplay muted playsinline></video>
        <p class="error-text" style="color: #ef4444; display: none;"></p>
        <button id="btn-check-camera" class="secondary-button">Start Camera Check</button>
      </div>
    </div>

    <div class="check-item" id="check-mic">
      <div class="check-header">
        <span>2. Microphone Check</span>
        <span class="status-icon status-pending">⏳</span>
      </div>
      <div class="check-content">
        <div class="mic-meter-container">
          <div class="mic-meter" id="mic-level"></div>
        </div>
        <p style="font-size: 0.875rem; color: #6b7280;">Please make some noise to test your microphone.</p>
        <p class="error-text" style="color: #ef4444; display: none;"></p>
        <button id="btn-check-mic" class="secondary-button">Start Mic Check</button>
      </div>
    </div>

    <div class="check-item" id="check-apps">
      <div class="check-header">
        <span>3. Running Apps Check</span>
        <span class="status-icon status-pending">⏳</span>
      </div>
      <div class="check-content">
        <p style="font-size: 0.875rem; color: #6b7280;">Checking for unauthorized background apps...</p>
        <ul class="app-list" id="unauthorized-list"></ul>
        <p class="error-text" style="color: #ef4444; display: none;"></p>
        <button id="btn-check-apps" class="secondary-button">Run App Check</button>
      </div>
    </div>

    <button id="btn-begin-exam" disabled>Begin Exam</button>
  </div>
  <script src="./selfCheck.js"></script>
</body>
</html>
