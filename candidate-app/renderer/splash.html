<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntegrityFlow</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557d0;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(26, 115, 232, 0.25) 0%, rgba(26, 115, 232, 0) 70%);
      border-radius: 50%;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .logo-img {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(26, 115, 232, 0.25);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .progress-bar-track {
      width: 240px;
      height: 4px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar-indeterminate {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: linear-gradient(90deg, #1a73e8, #4285f4);
      border-radius: 999px;
      animation: indeterminate 1.6s infinite ease-in-out;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 0.9;
      }
    }

    @keyframes indeterminate {
      0% {
        left: -35%;
        right: 100%;
      }
      60% {
        left: 100%;
        right: -90%;
      }
      100% {
        left: 100%;
        right: -90%;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="assets/icon.png" alt="IntegrityFlow Logo" class="logo-img">
    </div>
    <h1 class="brand-title">IntegrityFlow</h1>
    <p class="brand-subtitle">Starting exam environment...</p>
    
    <div class="progress-bar-track">
      <div class="progress-bar-indeterminate"></div>
    </div>
    <p class="status-text">Initializing AI monitoring & security pipeline...</p>
  </div>
</body>
</html>
